<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ALOCO</title>
<script>
/* ──────────────────────────────────────────────────────────────────
   Esta pagina e servida pelo GitHub Pages para QUALQUER caminho que
   nao existe. O caminho /painel/<slug> esta em notificacoes e em
   mensagens de WhatsApp ja entregues, e nao da para voltar atras
   nelas. Entao aqui ele e redirecionado para o painel de verdade.

   O redirecionamento acontece ANTES de desenhar qualquer coisa, para
   nao piscar a tela de erro no caminho.

   NAO gerar manifest aqui. A versao antiga desta pagina criava um
   manifest em tempo de execucao com scope = location.pathname, o que
   instalava um PWA preso em /painel/<slug>. Era a causa do painel
   velho ficar na tela inicial dos donos.
   ────────────────────────────────────────────────────────────────── */
(function(){
  try {
    var m = location.pathname.match(/^\/painel\/([^\/?#]+)\/?$/i);
    if (!m || !m[1]) return;

    var slug = decodeURIComponent(m[1]).toLowerCase().trim();
    if (!slug || slug === 'index.html') return;

    var q = new URLSearchParams(location.search);
    q.set('b', slug);

    location.replace('/painel-app-pwa/?' + q.toString() + location.hash);
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#060607; --sf:#0F0F12; --bd:rgba(255,255,255,.09);
  --tx:#EDEAE6; --tx2:rgba(237,234,230,.58); --azul:#0097fd;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px; padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  text-align:center;
}
.cx{max-width:380px;width:100%}
.ic{
  width:64px;height:64px;margin:0 auto 24px;border-radius:18px;
  background:var(--sf);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
}
h1{margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 28px;color:var(--tx2);font-size:15px}
a.bt{
  display:inline-block;padding:14px 26px;border-radius:12px;
  background:var(--azul);color:#fff;text-decoration:none;
  font-weight:600;font-size:15px;
}
a.bt:active{opacity:.85}
.mk{margin-top:32px;font-size:12px;color:rgba(237,234,230,.28);letter-spacing:.08em}
</style>
</head>
<body>
  <div class="cx">
    <div class="ic">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="#0097fd" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>
      </svg>
    </div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou foi movido.</p>
    <div class="mk">ALOCO</div>
  </div>
</body>
</html>
