<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha Agenda</title>
<style>
:root{--fundo:#0B0D10;--sup:#14181D;--linha:#232A33;--txt:#EDEAE4;--txt2:#9AA3AD;--azul:#0097FD;--azul2:#5CBBFF;--verde:#25D366;--verm:#E0555E;
--ff:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:var(--ff);-webkit-font-smoothing:antialiased}
body{padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:8px}

/* login */
.login{min-height:100svh;display:grid;place-content:center;gap:14px;text-align:center}
.login h1{font-size:26px;margin:0}
.login p{color:var(--txt2);margin:0 0 6px;font-size:15px}
.login input{width:100%;max-width:280px;margin-inline:auto;background:var(--sup);border:1px solid var(--linha);color:var(--txt);
  border-radius:14px;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;text-transform:uppercase}
.btn{background:var(--azul);color:#04121F;border:0;border-radius:14px;padding:16px 22px;font-size:17px;font-weight:700;cursor:pointer;width:100%;max-width:280px;margin-inline:auto}
.btn.sec{background:transparent;border:1px solid var(--linha);color:var(--txt)}
.erro{color:#FF8A90;font-size:14px;min-height:18px}

/* topo */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px}
header b{font-size:19px}
header span{font-size:13px;color:var(--txt2);display:block}
header button{background:transparent;border:1px solid var(--linha);color:var(--txt2);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}

/* resumo */
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.card{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px 12px;text-align:center}
.card i{display:block;font-style:normal;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin-bottom:6px}
.card b{font-size:20px;font-variant-numeric:tabular-nums}
.card.dest b{color:var(--azul2)}

/* dias */
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 auto;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:10px 12px;text-align:center;cursor:pointer;min-width:62px}
.dia u{display:block;text-decoration:none;font-size:11px;color:var(--txt2);text-transform:uppercase}
.dia b{display:block;font-size:19px;line-height:1.2}
.dia em{font-style:normal;font-size:11px;color:var(--azul2)}
.dia.on{background:var(--azul);border-color:var(--azul);color:#04121F}
.dia.on u,.dia.on em{color:#04121F}

/* lista */
.hora{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;gap:10px}
.lin{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.h{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.v{font-size:15px;color:var(--azul2);font-weight:700}
.cli{font-size:17px;font-weight:600}
.svc{font-size:14px;color:var(--txt2)}
.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-weight:700}
.t-CONFIRMADO{background:rgba(37,211,102,.16);color:#7BE6A6}
.t-PENDENTE{background:rgba(0,151,253,.16);color:var(--azul2)}
.t-CANCELADO{background:rgba(224,85,94,.16);color:#FF8A90}
.t-PAGO{background:rgba(37,211,102,.16);color:#7BE6A6}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes button,.acoes a{flex:1 1 30%;text-align:center;text-decoration:none;border-radius:12px;padding:12px 8px;font-size:14px;font-weight:700;border:1px solid var(--linha);background:transparent;color:var(--txt);cursor:pointer}
.acoes .ok{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.5);color:#7BE6A6}
.acoes .no{background:rgba(224,85,94,.12);border-color:rgba(224,85,94,.45);color:#FF8A90}
.acoes .wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.35);color:#9BEFC0}
.vazio{text-align:center;color:var(--txt2);padding:40px 10px;font-size:15px}
.aviso{font-size:12px;color:var(--txt2);text-align:center;margin-top:16px}
.carregando{text-align:center;color:var(--txt2);padding:20px;font-size:14px}
</style>
</head>
<body>

<div id="tela-login" class="login" hidden>
  <h1>Minha Agenda</h1>
  <p>Digite o código que o dono da barbearia te passou</p>
  <input id="cod" inputmode="latin" autocomplete="one-time-code" maxlength="6" placeholder="ABC123">
  <button class="btn" id="entrar">Entrar</button>
  <div class="erro" id="erro"></div>
</div>

<div id="tela-app" hidden>
  <header>
    <div><b id="nome">—</b><span id="sub">carregando…</span></div>
    <button id="sair">Sair</button>
  </header>
  <div class="resumo">
    <div class="card"><i>Atendimentos</i><b id="r-qtd">0</b></div>
    <div class="card"><i>Produzido</i><b id="r-total">R$ 0</b></div>
    <div class="card dest"><i>Sua parte</i><b id="r-com">R$ 0</b></div>
  </div>
  <div class="dias" id="dias"></div>
  <div id="lista"><div class="carregando">Carregando…</div></div>
  <p class="aviso">Os valores mostram o que passou por você no dia.</p>
</div>

<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbwjH7c69qlBz58Cuy0c23Yq7kSC-4PpohEqQCpKUy4gAb6Q1Syzqp-hxVra00wRr7RhiQ/exec';

  function q(id){ return document.getElementById(id); }
  var params = new URLSearchParams(location.search);
  var SLUG = (params.get('b') || '').toLowerCase();
  var KEY  = 'aloco_barb_' + SLUG;
  var COD  = '';
  var DIA  = '';
  var dados = null;

  try { COD = localStorage.getItem(KEY) || ''; } catch(e) {}
  try { var cache = JSON.parse(localStorage.getItem(KEY + '_d') || 'null'); if (cache) { dados = cache; } } catch(e) {}

  function moeda(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR'); }
  function wa(tel){ var d = String(tel||'').replace(/\D/g,''); if(!d) return ''; if(d.length===11) d='55'+d; else if(d.length===10) d='55'+d.slice(0,2)+'9'+d.slice(2); else if(d.indexOf('55')!==0) d='55'+d; return 'https://wa.me/'+d; }

  function mostrarLogin(msg){
    q('tela-app').hidden = true; q('tela-login').hidden = false;
    q('erro').textContent = msg || '';
    q('cod').focus();
  }
  function mostrarApp(){ q('tela-login').hidden = true; q('tela-app').hidden = false; }

  function buscar(data){
    var url = API + '?action=barb_agenda&b=' + encodeURIComponent(SLUG) + '&codigo=' + encodeURIComponent(COD) + (data ? '&data=' + data : '');
    return fetch(url).then(function(r){ return r.json(); });
  }

  function pintar(j){
    dados = j; DIA = j.data;
    mostrarApp();
    q('nome').textContent = j.barbeiro.nome || 'Barbeiro';
    var d = new Date(j.data + 'T12:00:00');
    var sem = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()];
    q('sub').textContent = (j.data === j.hoje ? 'Hoje, ' : '') + sem + ' ' + ('0'+d.getDate()).slice(-2) + '/' + ('0'+(d.getMonth()+1)).slice(-2);
    q('r-qtd').textContent = j.resumo.atendimentos;
    q('r-total').textContent = moeda(j.resumo.total);
    q('r-com').textContent = moeda(j.resumo.comissao);
    q('r-com').parentNode.querySelector('i').textContent = 'Sua parte (' + j.resumo.pct + '%)';

    var hd = '';
    j.proximos.forEach(function(p){
      hd += '<div class="dia' + (p.data === j.data ? ' on' : '') + '" data-d="' + p.data + '">' +
            '<u>' + p.semana + '</u><b>' + p.dia + '</b><em>' + (p.qtd ? p.qtd + (p.qtd>1?' hor.':' hor.') : '—') + '</em></div>';
    });
    q('dias').innerHTML = hd;

    if (!j.agenda.length){
      q('lista').innerHTML = '<div class="vazio">Nenhum horário marcado nesse dia.</div>';
      return;
    }
    var h = '';
    j.agenda.forEach(function(a){
      var link = wa(a.telefone);
      h += '<div class="hora">' +
             '<div class="lin"><span class="h">' + a.hora + '</span>' +
               '<span class="tag t-' + a.status + '">' + a.status.charAt(0) + a.status.slice(1).toLowerCase() + '</span></div>' +
             '<div class="lin"><span class="cli">' + (a.cliente || 'Cliente') + '</span><span class="v">' + moeda(a.valor) + '</span></div>' +
             '<div class="svc">' + (a.servico || '') + '</div>' +
             '<div class="acoes">' +
               (a.status !== 'CONFIRMADO' && a.status !== 'PAGO' ? '<button class="ok" data-id="' + a.id + '" data-st="CONFIRMADO">Confirmar</button>' : '') +
               (a.status !== 'CANCELADO' ? '<button class="no" data-id="' + a.id + '" data-st="CANCELADO">Cancelar</button>' : '') +
               (link ? '<a class="wa" href="' + link + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
             '</div>' +
           '</div>';
    });
    q('lista').innerHTML = h;
  }

  function carregar(data){
    if (dados && !data) { pintar(dados); }                       // mostra o que já temos
    else if (data) { q('lista').innerHTML = '<div class="carregando">Carregando…</div>'; }
    buscar(data).then(function(j){
      if (!j || !j.ok){
        if (j && j.erro === 'codigo_invalido'){ try{ localStorage.removeItem(KEY); }catch(e){} COD=''; mostrarLogin('Código não confere.'); return; }
        if (j && j.erro === 'assinatura_expirada'){ q('lista').innerHTML = '<div class="vazio">O acesso da barbearia está bloqueado. Fale com o dono.</div>'; return; }
        return;
      }
      try { localStorage.setItem(KEY + '_d', JSON.stringify(j)); } catch(e) {}
      pintar(j);
    }).catch(function(){
      if (!dados) q('lista').innerHTML = '<div class="vazio">Sem conexão. Tente de novo.</div>';
    });
  }

  q('entrar').addEventListener('click', function(){
    var c = q('cod').value.trim().toUpperCase();
    if (c.length < 4){ q('erro').textContent = 'Digite o código completo.'; return; }
    COD = c; q('erro').textContent = 'Entrando…';
    buscar('').then(function(j){
      if (j && j.ok){ try { localStorage.setItem(KEY, COD); } catch(e) {} carregar(''); }
      else q('erro').textContent = (j && j.erro === 'assinatura_expirada') ? 'Acesso da barbearia bloqueado.' : 'Código não confere.';
    }).catch(function(){ q('erro').textContent = 'Sem conexão.'; });
  });
  q('cod').addEventListener('keydown', function(e){ if (e.key === 'Enter') q('entrar').click(); });

  q('sair').addEventListener('click', function(){
    try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '_d'); } catch(e) {}
    COD = ''; dados = null; mostrarLogin('');
  });

  q('dias').addEventListener('click', function(e){
    var el = e.target.closest('.dia'); if (!el) return;
    carregar(el.getAttribute('data-d'));
  });

  q('lista').addEventListener('click', function(e){
    var bt = e.target.closest('button[data-id]'); if (!bt) return;
    var id = bt.getAttribute('data-id'), st = bt.getAttribute('data-st');
    if (st === 'CANCELADO' && !confirm('Cancelar esse horário?')) return;
    bt.disabled = true; bt.textContent = '...';
    fetch(API, { method:'POST', body: JSON.stringify({ action:'barb_status', b:SLUG, codigo:COD, id:id, status:st }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ carregar(DIA === dados.hoje ? '' : DIA); })
      .catch(function(){ bt.disabled = false; bt.textContent = st === 'CONFIRMADO' ? 'Confirmar' : 'Cancelar'; });
  });

  if (!SLUG){ mostrarLogin('Endereço sem a barbearia. Use o link que o dono te enviou.'); return; }
  if (COD) carregar(''); else mostrarLogin('');
})();
</script>
</body>
</html>
