<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALoCO">
<title>ALoCO - Central de Logos</title>
<style>
html,body{margin:0;height:100%;background:#080B10;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#carregando{position:fixed;inset:0;display:grid;place-items:center;background:#080B10;z-index:2;transition:opacity .4s}
.aro{width:34px;height:34px;border:3px solid rgba(10,132,255,.25);border-top-color:#0A84FF;border-radius:50%;animation:roda .8s linear infinite}
@keyframes roda{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="carregando"><div class="aro"></div></div>
<iframe src="https://script.google.com/macros/s/AKfycbyf15fH0bXnoi_yuj9voEtsm1yQAPNDUdTAHXlI98FnrNp_n4kYXyvRScB_hGJKRHYL/exec?tela=adm" title="Central de Logos" allow="clipboard-write" onload="var c=document.getElementById('carregando');c.style.opacity=0;setTimeout(function(){c.remove();},450);"></iframe>
</body>
</html>
